name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支的重复推送取消上一次未完成的运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # 1. 跨平台编译 + 单元测试 + 契约测试
  #    这一步是「三平台都能编译」的主要保障：
  #    Windows 会真正编译 wasapi 内录、macOS 会编译 CoreAudio 路径，
  #    平台专属代码的拼写/API 错误在这里就会暴露。
  # ==========================================================================
  test:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            patchelf

      # 版本由 package.json 的 packageManager 决定，避免本地与 CI 不一致
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo 与 target/：命中后二次构建从 5~8 分钟降到 1 分钟内
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 区分不同平台的缓存，避免互相覆盖
          key: ${{ matrix.os }}-test

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端构建
        run: pnpm build

      # 用 bash 跑并落盘日志：失败时把关键行转成 GitHub annotation，
      # 这样即使没有仓库 admin 权限（无法下载 job 日志）也能从 API 读到失败原因。
      - name: Rust 单元测试
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee unit-test.log
          exit ${PIPESTATUS[0]}

      - name: Rust 失败诊断
        if: failure()
        shell: bash
        run: |
          if [ -f unit-test.log ]; then
            echo "===== 失败摘要 ====="
            grep -E "^(error|failures:|---- |thread |assertion|  left|  right|test result)" -A3 unit-test.log | head -80 || true
            echo "===== 上报为 annotation ====="
            grep -E "^(error|failures:|---- |thread '.*' panicked|test result)" -A3 unit-test.log | head -50 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi

      - name: 前后端契约一致性测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --test contract

      - name: 编译全部 target（含二进制）
        run: cargo build --manifest-path src-tauri/Cargo.toml --all-targets

  # ==========================================================================
  # 2. 前端 UI 冒烟测试（Playwright，仅 Linux）
  # ==========================================================================
  ui-smoke:
    name: 界面冒烟测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 决定，避免本地与 CI 不一致
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行界面冒烟测试
        run: pnpm test:ui

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================================================
  # 3. 三平台打包
  # ==========================================================================
  build:
    name: 打包 · ${{ matrix.name }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux-x64
            artifact: linux
          - os: windows-latest
            name: Windows-x64
            artifact: windows
          - os: macos-latest
            name: macOS-arm64
            artifact: macos
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            patchelf

      # 版本由 package.json 的 packageManager 决定，避免本地与 CI 不一致
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 打包用的是 release profile，和 test job 的 dev profile 是不同缓存，
      # 所以这里单独一份 key。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-release

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 显式指定产物类型：默认的 "all" 在 Linux 上还会尝试 rpm，
      # 而 GitHub runner 没有 rpmbuild，会直接失败。
      - name: 打包（Linux）
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,appimage

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi,nsis

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles dmg,app

      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb dist-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts/

      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" dist-artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" dist-artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem dist-artifacts

      - name: 收集产物（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          cp -R src-tauri/target/release/bundle/macos/*.app dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MeetingHear-${{ matrix.artifact }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # 4. 打 tag 时自动发布
  # ==========================================================================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
