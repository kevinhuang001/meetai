name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支的重复推送取消上一次未完成的运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Linux 测试与打包都要用的系统依赖，集中定义避免两处不一致
  LINUX_APT_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    libasound2-dev libxdo-dev patchelf

jobs:
  # ==========================================================================
  # 1. 跨平台编译 + 单元测试 + 契约测试
  #    三平台矩阵：Windows 会真正编译 wasapi 内录、macOS 会编译 CoreAudio 路径，
  #    平台专属代码的拼写/API 错误只有在这里才暴露得出来。
  # ==========================================================================
  test:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # apt 包也缓存：系统依赖 100MB+，每个 job 重装要 1 分钟左右
      - name: 安装 Linux 系统依赖（带缓存）
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.LINUX_APT_PACKAGES }}
          version: 1.0

      # 版本由 package.json 的 packageManager 决定，避免本地与 CI 不一致
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache 的缓存里已经包含 ~/.cargo/registry 与 ~/.cargo/git，
      # 所以**不要**再单独加一层 registry 缓存 —— 那样每个 job 会白恢复一次几百 MB。
      # 这里只需要按 profile 分开缓存编译产物（dev 供测试、release 供打包）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-test
          # 默认失败时不保存缓存，但编译失败恰恰最需要缓存（重试能快很多）
          cache-on-failure: true

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端构建
        run: pnpm build

      # 用 bash 跑并落盘日志：失败时把关键行转成 GitHub annotation，
      # 这样即使没有仓库 admin 权限（无法下载 job 日志）也能从 API 读到失败原因
      - name: Rust 单元测试
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee unit-test.log
          exit ${PIPESTATUS[0]}

      - name: Rust 失败诊断
        if: failure()
        shell: bash
        run: |
          if [ -f unit-test.log ]; then
            echo "===== 失败摘要 ====="
            grep -E "^(error|failures:|---- |thread |assertion|  left|  right|test result)" -A3 unit-test.log | head -80 || true
            echo "===== 上报为 annotation ====="
            grep -E "^(error|failures:|---- |thread '.*' panicked|test result)" -A3 unit-test.log | head -50 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi

      - name: 前后端契约一致性测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --test contract

      - name: 编译全部 target（含二进制）
        run: cargo build --manifest-path src-tauri/Cargo.toml --all-targets

  # ==========================================================================
  # 2. 前端 UI 冒烟测试（只依赖 Node，不碰 Rust，所以单独跑得很快）
  # ==========================================================================
  ui-smoke:
    name: 界面冒烟测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行界面冒烟测试
        run: pnpm test:ui

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================================================
  # 3. 三平台打包
  #
  #    注意：这个 job 会重新装一遍依赖 —— 这是 GitHub Actions 的固有行为：
  #    每个 job 都在全新虚拟机上跑，磁盘不共享，**只有 cache 会跨 job 复用**。
  #    因此这里每一步都配了缓存（apt 包 / rust-cache 含 registry / pnpm store），
  #    命中后基本没有下载，只剩「release profile 的编译」必须重来
  #    —— 它和测试用的 dev profile 是两份不同的产物，这份时间省不掉。
  #
  #    PR 上跳过打包步骤以省时间，编译与测试仍然照跑。
  # ==========================================================================
  build:
    name: 打包 · ${{ matrix.name }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux-x64
            artifact: linux
          - os: windows-latest
            name: Windows-x64
            artifact: windows
          - os: macos-latest
            name: macOS-arm64
            artifact: macos
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（带缓存，直接命中 test job 建立的缓存）
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.LINUX_APT_PACKAGES }}
          version: 1.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 与 test job 相同：registry 由 rust-cache 一并缓存（本 job 上一次运行的缓存里就有），
      # 真正需要重新做的只有 release profile 的编译本身
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-release
          cache-on-failure: true

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 显式指定产物类型：默认的 "all" 在 Linux 上还会尝试 rpm，
      # 而 GitHub runner 没有 rpmbuild，会直接失败
      - name: 打包（Linux）
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: pnpm tauri build --bundles deb,appimage

      - name: 打包（Windows）
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: pnpm tauri build --bundles msi,nsis

      - name: 打包（macOS）
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: pnpm tauri build --bundles dmg,app

      - name: 收集产物（Linux）
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb dist-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts/

      - name: 收集产物（Windows）
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" dist-artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" dist-artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem dist-artifacts

      - name: 收集产物（macOS）
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          cp -R src-tauri/target/release/bundle/macos/*.app dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts/

      - name: 上传安装包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MeetingHear-${{ matrix.artifact }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # 4. 打 tag 时自动发布
  # ==========================================================================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
